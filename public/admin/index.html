<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings</title><link rel="stylesheet" href="/style.css"><meta name="robots" content="noindex">
<style>.c{background:var(--sky);border-left:6px solid var(--sun);padding:.8rem 1rem;margin:.8rem 0;border-radius:4px}.c.old{opacity:.55;border-left-color:#999}.c h3{margin:0;font:700 1.1rem system-ui}.c p{margin:.3rem 0}.l a{display:inline-block;margin:.3rem .5rem .3rem 0;font:600 15px system-ui}.c button{padding:.45rem .8rem;margin:.2rem .3rem .2rem 0;font-size:14px}.d{font:700 .95rem system-ui;margin-top:1.4rem;color:var(--deep)}</style></head>
<body><main><h1>Bookings</h1><div id="b"></div></main>
<script>
const box=document.getElementById('b');
async function act(id,body){await fetch('/api/admin',{method:'PATCH',body:JSON.stringify({id,...body})});load()}
function el(t,tx,cl){const e=document.createElement(t);if(tx)e.textContent=tx;if(cl)e.className=cl;return e}
function link(tx,href){const a=el('a',tx);a.href=href;return a}
function btn(l,f){const b=el('button',l);b.onclick=f;return b}
async function load(){const r=await (await fetch('/api/admin')).json();box.replaceChildren();
const live=x=>x.status==='requested'||x.status==='confirmed';
r.sort((a,b)=>(live(b)-live(a))||String(a.pref_date).localeCompare(b.pref_date));
let last='';
for(const x of r){const ds=x.pref_date?new Date(x.pref_date+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}):'No date';
if(live(x)&&ds!==last){box.append(el('div',ds,'d'));last=ds}else if(!live(x)&&last!=='old'){box.append(el('div','Completed / cancelled','d'));last='old'}
const c=el('div','', 'c'+(live(x)?'':' old'));
c.append(el('h3',`${x.name} · $${x.estimate}`),el('p',`${x.pref_time} · ${x.small} small, ${x.standard} standard · ${x.status}${x.paid?' · PAID':''}`),el('p',x.address));
if(x.notes)c.append(el('p','Notes: '+x.notes));
const tel=String(x.phone).replace(/[^\d+]/g,''),l=el('div','','l');
l.append(link('Directions','https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(x.address)),link('Call','tel:'+tel),link('Text','sms:'+tel),link('Email','mailto:'+x.email));
c.append(l,btn('Confirm',()=>act(x.id,{status:'confirmed'})),btn('Done',()=>act(x.id,{status:'completed'})),btn('Paid',()=>act(x.id,{paid:1})),btn('Cancel',()=>act(x.id,{status:'cancelled'})));
box.append(c)}
if(!r.length)box.append(el('p','No requests yet.'))}
load()</script></body></html>
