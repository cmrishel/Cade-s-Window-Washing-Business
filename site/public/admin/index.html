<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings</title><link rel="stylesheet" href="/style.css"><meta name="robots" content="noindex"></head><body><main style="max-width:1100px"><h1>Bookings</h1><table><thead><tr><th>Customer</th><th>Job</th><th>Requested</th><th>Status</th><th>Actions</th></tr></thead><tbody id="b"></tbody></table></main>
<script>
const tb=document.getElementById('b');
async function act(id,body){await fetch('/api/admin',{method:'PATCH',body:JSON.stringify({id,...body})});load()}
function td(t){const c=document.createElement('td');if(typeof t==='string')c.textContent=t;else c.append(...t);return c}
function btn(l,f){const b=document.createElement('button');b.textContent=l;b.style.cssText='padding:.3rem .6rem;margin:2px;font-size:13px';b.onclick=f;return b}
async function load(){const r=await (await fetch('/api/admin')).json();tb.replaceChildren();
for(const x of r){const tr=document.createElement('tr');
tr.append(td(`${x.name}\n${x.phone}\n${x.email}\n${x.address}`),td(`${x.small} small, ${x.standard} std\nEst $${x.estimate}\n${x.notes||''}`),td(`${x.pref_date} (${x.pref_time})`),td(`${x.status}${x.paid?' · PAID':''}`),
td([btn('Confirm',()=>act(x.id,{status:'confirmed'})),btn('Done',()=>act(x.id,{status:'completed'})),btn('Paid',()=>act(x.id,{paid:1})),btn('Cancel',()=>act(x.id,{status:'cancelled'}))]));
tr.style.whiteSpace='pre-line';tb.append(tr)}}
load()</script></body></html>
